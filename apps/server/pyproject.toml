[project]
name = "mirrorbound"
version = "0.1.0"
description = "MirrorBound authoritative game server: deterministic simulation + agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mirrorbound"]

[tool.pytest.ini_options]
testpaths = ["tests"]
